version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /bin, /sbin, /etc, /proc, /opt]
  read_write: [/workspace, /tmp, /dev/null, /var/lib/xangi, /var/lib/neonxangi, /var/log/neonxangi]
landlock:
  compatibility: best_effort
network_policies:
  codex_inference:
    name: codex-inference
    endpoints:
      - { host: api.openai.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
      - { host: auth.openai.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
      - { host: chatgpt.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
      - { host: ab.chatgpt.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
    binaries:
      - { path: /usr/local/bin/codex }
      - { path: /usr/local/lib/node_modules/@openai/codex/** }
  github_read:
    name: github-read
    endpoints:
      - { host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/codex }
  package_read:
    name: package-read
    endpoints:
      - { host: registry.npmjs.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - { path: /usr/bin/npm }
      - { path: /usr/bin/node }
  loopback_xangi:
    name: loopback-xangi
    endpoints:
      - { host: 127.0.0.1, port: 18789, protocol: rest, enforcement: enforce, access: full }
    binaries:
      - { path: /usr/local/bin/node }
