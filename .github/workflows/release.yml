name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'karaage0703/neonxangi'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and source
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          npm ci
          npm run check
      - name: Install pinned OpenShell CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/NVIDIA/OpenShell/d1155aa70042d3e2ee49dbfa15346b108b7c1d92/install.sh -o /tmp/openshell-install.sh
          OPENSHELL_VERSION=v0.0.116 sh /tmp/openshell-install.sh
          openshell --version
      - name: Build managed bundle
        env:
          NEONXANGI_BUNDLE_PLATFORM: linux
          NEONXANGI_BUNDLE_ARCH: ${{ matrix.arch }}
          NEONXANGI_BUNDLE_OPENSHELL_VERSION: 0.0.116
        run: |
          bash packaging/build-bundle.sh "release-bundles/neonxangi-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: neonxangi-linux-${{ matrix.arch }}
          path: release-bundles/neonxangi-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'karaage0703/neonxangi'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: neonxangi-linux-*
          path: release-bundles
          merge-multiple: true
      - name: Assemble release assets
        run: |
          cp install.sh release-bundles/install.sh
          cp packaging/install-bundle.sh release-bundles/install-bundle.sh
          chmod 0755 release-bundles/install.sh release-bundles/install-bundle.sh
          cd release-bundles
          sha256sum install.sh install-bundle.sh neonxangi-linux-arm64.tar.gz neonxangi-linux-x64.tar.gz > neonxangi-checksums-sha256.txt
      - name: Create or replace release assets
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-bundles/* --clobber
          else
            gh release create "$RELEASE_TAG" release-bundles/* --title "$RELEASE_TAG" --generate-notes --latest
          fi
